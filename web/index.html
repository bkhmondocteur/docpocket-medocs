<!DOCTYPE html>
<html lang="fr">
<head>
  <script>
    // Assure la présence du slash final pour GitHub Pages afin d'éviter les erreurs 404 sur les assets relatifs
    if (!location.pathname.endsWith('/') && !location.pathname.includes('.')) {
      location.replace(location.pathname + '/' + location.search + location.hash);
    }
  </script>

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="DocPocket Medocs - Application médicale complète de gestion des échantillons médicaux pour cabinets médicaux.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DocPocket Medocs">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DocPocket Medocs</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #F8FAFC;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    @keyframes load-bar {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(50%); }
      100% { transform: translateX(200%); }
    }
    .loading-pulse {
      animation: pulse 1.8s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
      100% { opacity: 0.85; transform: scale(1); }
    }
  </style>
</head>
<body>
  <!-- Écran de chargement médical instantané pour éviter tout écran blanc -->
  <div id="flutter-loading-screen" style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; width:100vw; background-color:#F8FAFC;">
    <img class="loading-pulse" src="favicon.png" style="width:110px; height:110px; border-radius:24px; box-shadow:0 8px 24px rgba(21,101,192,0.15);" alt="DocPocket Medocs">
    <h2 style="color:#1565C0; margin-top:22px; margin-bottom:4px; font-size:24px; font-weight:700;">DocPocket Medocs</h2>
    <p style="color:#546E7A; font-size:14px; margin-top:2px; margin-bottom:20px;">Chargement du cabinet médical...</p>
    <div style="width:180px; height:5px; background:#E3F2FD; border-radius:6px; overflow:hidden; position:relative;">
      <div style="position:absolute; width:45%; height:100%; background:#1565C0; border-radius:6px; animation:load-bar 1.3s infinite ease-in-out;"></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
